<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — RescueFly</title><link rel="stylesheet" href="../css/app.css"></head><body class="auth-bg"><div class="auth-card"><a class="auth-logo" href="../index.html">Rescue<span>Fly</span></a><h1>Welcome back.</h1><p>Open your recovery workspace and keep your journey moving.</p><div id="alert" class="alert"></div><form id="form" class="auth-form"><div class="field"><label>Email</label><input id="email" type="email" required placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" required minlength="8" placeholder="••••••••"></div><button class="btn" type="submit">Sign in →</button></form><div class="auth-switch">New to RescueFly? <a href="register.html">Create an account</a></div><div class="auth-switch" style="margin-top:10px"><small>Demo: demo@rescuefly.app / RescueFly@123</small></div></div><script src="../js/app.js"></script><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const a=document.getElementById('alert');a.className='alert';const emailEl=document.getElementById('email'),passwordEl=document.getElementById('password');try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({email:emailEl.value.trim(),password:passwordEl.value})});saveAuth(d);location.href='dashboard.html'}catch(x){a.textContent=x.message;a.className='alert error'}}</script></body></html>
