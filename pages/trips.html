<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My trips — RescueFly</title><link rel="stylesheet" href="../css/app.css"></head><body class="page-bg"><header class="topbar"><div class="shell inner"><a class="brand" href="dashboard.html">✦ Rescue<span>Fly</span></a><nav class="main-nav"><a href="dashboard.html">Overview</a><a class="active" href="trips.html">My trips</a><a href="recovery.html">Recovery</a><a href="documents.html">Documents</a><a href="profile.html">Profile</a></nav><div class="user-menu"><span data-user-name>Traveler</span><button data-logout class="btn btn-small">Logout</button></div></div></header><main class="shell page-content"><div class="page-head"><h1>My journeys</h1><p>Register your flight and let RescueFly build the recovery plan when disruption occurs.</p></div><section class="content-card"><h2 class="section-title">Add journey</h2><div id="alert" class="alert"></div><form id="tripForm" class="form-grid"><div class="field"><label>Passenger name</label><input id="passengerName" required></div><div class="field"><label>Airline</label><input id="airline" required placeholder="IndiGo"></div><div class="field"><label>Flight number</label><input id="flightNumber" required placeholder="6E 421"></div><div class="field"><label>Origin</label><input id="origin" required placeholder="Hyderabad (HYD)"></div><div class="field"><label>Destination</label><input id="destination" required placeholder="Delhi (DEL)"></div><div class="field full"><label>Disruption / booking note</label><textarea id="disruptionNote" placeholder="Cancellation, delay, missed connection, hotel loss…"></textarea></div><div><button class="btn" type="submit">Save journey →</button></div></form></section><div style="height:22px"></div><section class="content-card"><h2 class="section-title">Journey history</h2><div id="list" class="table-wrap"><div class="empty">Loading…</div></div></section></main><script src="../js/app.js"></script><script>guard();setupNav();async function load(){const t=await api('/trips');document.getElementById('list').innerHTML=t.length?`<table class="table"><thead><tr><th>Reference</th><th>Passenger</th><th>Route</th><th>Flight</th><th>Status</th><th>Recovery</th></tr></thead><tbody>${t.map(x=>`<tr><td><b>${esc(x.referenceCode)}</b></td><td>${esc(x.passengerName)}</td><td>${esc(x.origin)} → ${esc(x.destination)}</td><td>${esc(x.airline)} ${esc(x.flightNumber)}</td><td><span class="badge">${esc(x.status)}</span></td><td><button class="btn btn-small" type="button" onclick="openRecovery(${x.id})">Run recovery</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No journeys registered.</div>'}window.openRecovery=id=>location.href='recovery.html?trip='+encodeURIComponent(id);load();document.getElementById('tripForm').onsubmit=async e=>{e.preventDefault();const a=document.getElementById('alert');a.className='alert';const passengerNameEl=document.getElementById('passengerName'),airlineEl=document.getElementById('airline'),flightNumberEl=document.getElementById('flightNumber'),originEl=document.getElementById('origin'),destinationEl=document.getElementById('destination'),disruptionNoteEl=document.getElementById('disruptionNote');const payload={passengerName:passengerNameEl.value.trim(),airline:airlineEl.value.trim(),flightNumber:flightNumberEl.value.trim(),origin:originEl.value.trim(),destination:destinationEl.value.trim(),disruptionNote:disruptionNoteEl.value.trim()};if(!payload.passengerName||!payload.airline||!payload.flightNumber||!payload.origin||!payload.destination){a.textContent='Please fill passenger, airline, flight number, origin and destination.';a.className='alert error';return}try{await api('/trips',{method:'POST',body:JSON.stringify(payload)});a.textContent='Journey saved successfully. Click Run recovery to demonstrate the complete RescueFly workflow.';a.className='alert success';e.target.reset();load()}catch(x){a.textContent=x.message;a.className='alert error'}}</script></body></html>
