<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — RescueFly</title><link rel="stylesheet" href="../css/app.css"></head><body class="auth-bg"><div class="auth-card"><a class="auth-logo" href="../index.html">Rescue<span>Fly</span></a><h1>Create your workspace.</h1><p>One account for trips, recovery cases and travel documents.</p><div id="alert" class="alert"></div><form id="form" class="auth-form"><div class="field"><label>Full name</label><input id="name" required maxlength="80" placeholder="Your name"></div><div class="field"><label>Email</label><input id="email" type="email" required placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" required minlength="8" placeholder="At least 8 characters"></div><button class="btn" type="submit">Create account →</button></form><div class="auth-switch">Already have an account? <a href="login.html">Sign in</a></div></div><script src="../js/app.js"></script><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const a=document.getElementById('alert');a.className='alert';const nameEl=document.getElementById('name'),emailEl=document.getElementById('email'),passwordEl=document.getElementById('password');try{const d=await api('/auth/register',{method:'POST',body:JSON.stringify({name:nameEl.value.trim(),email:emailEl.value.trim(),password:passwordEl.value})});saveAuth(d);location.href='dashboard.html'}catch(x){a.textContent=x.message;a.className='alert error'}}</script></body></html>
